AboutApp = [兼容性] \r\n 1 = 适用于 Windows 11、10、8。 \r\n 2 = 适用于 64 位的操作系统。 \r\n 3 = 适配高分屏，最佳缩放比为 150%。 \r\n\r\n [关于项目] \r\n 1 = 技术栈：C#、.NET 10、Windows Forms。 \r\n 2 = Github：https://github.com/guanglinn/ContextMenuRector。 \r\n 3 = 开源协议：GPL-3.0。 \r\n\r\n [温馨提示] \r\n 1 = 本应用功能依赖大量针对注册表项和文件的读写增删等敏感操作，可能会被系统安全软件误报为病毒，如遇到该情况可自行将该程序添加到白名单。 \r\n 2 = 一些特殊的菜单项在启用后可能受到其他因素影响导致不会直接显示在右键菜单中，这是正常现象。 \r\n 3 = 不同右键管理程序禁用菜单项方式可能不同，建议不要同时使用多个右键菜单管理程序。大部分程序使用简单暴力的“备份-删除法”，此程序尽可能使用了系统提供的键值进行隐藏，通过其他程序禁用的菜单项目，请先使用原应程序还原，否则可能无法在该程序中看到。 \r\n 4 = 此程序不用于清理未卸载干净的程序，但可帮助你定位菜单项相关注册表和文件位置，你可根据相关内容进行你的操作，如果你不熟悉 Windows 系统，建议只使用菜单项的“禁用/启用”功能。

Dictionaries = [字典说明] \r\n 此程序拥有多份字典文件，每份字典又有用户字典 (User 目录) 和网络字典 (Web 目录)。如果想为此程序添加字典，可右键保存文件至 User 目录，并按照文件内说明进行添加右侧选项卡中为原始字典内容，你可以切换选项卡进行查看和右键编辑、保存操作。 \r\n\r\n [字典内容] \r\n 1 = 程序显示文本语言字典 (Languages 目录)。 \r\n 2 = ShellEx 菜单项 GUID 文本图标字典 (GuidInfosDic.ini)。 \r\n 3 = 系统和其他程序内部部分菜单详细设置规则字典 (DetailedEditDic.xml)。 \r\n 4 = 增强菜单项目字典 (EnhanceMenusDic.xml)。 \r\n 5 = UWP 新模块字典 (UWPModeItemsDic.xml)。

Donate = 如果这个软件对你有帮助，欢迎在 Github 上报告问题、贡献代码、点亮这个项目的 Star。
